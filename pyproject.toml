[build-system]
#build-backend = "hatchling.build"
#requires = ["hatchling>=1.24"]
requires = ["setuptools", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta"




[project]
name = 'hython'
authors = [
    {name = "Iacopo Ferrario", email = "iacopofederico.ferrario@eurac.edu"},
]
dynamic = ["version"]
license = {file = "LICENCE"}
readme = 'README.md'
requires-python = '==3.11.*'


[tool.setuptools.packages.find]
include = ["*"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "hython.__version__"}


[tool.pixi.workspace]
channels  = ["pytorch", "nvidia", "conda-forge"]
platforms = ["linux-64"]
 
[tool.pixi.system-requirements]
cuda = "12.1"
 
# ── Default (base) environment ─────────────────────────────
[tool.pixi.dependencies]
python = "3.11.*"

pytorch      = ">=2.1,<2.2"   # was "2.1.*" — TOML glob syntax is not semver; use range
pytorch-cuda = "12.1.*"
torchvision  = "0.16.1.*"
torchmetrics = "==1.7.1"
 
numpy      = ">=1.26,<2"   # upper-bound avoids accidental numpy 2 breakage until tested
xarray     = ">=2024.1"    # date-based versioning; avoid accidental old pin
dask       = ">=2024.1"
hydra-core = ">=1.3"
zarr       = "==3.1"
cf_xarray  = "==0.10.5"
# Data / ML helpers always useful alongside PyTorch
pandas       = ">=2.0,<3.0"
tqdm         = "*"
netcdf4      = "*"
#scikit-learn = ">=1.3"
 
# Geo stack — included in base because it is used in training scripts
#geopandas = ">=0.14"
#pyproj    = ">=3.6"
#shapely   = ">=2.0"
#rioxarray = ">=0.15"
#xesmf     = ">=0.8"
 
[tool.pixi.pypi-dependencies]
# Install hython itself as an editable pip package on top of the conda env
hython = { path = ".", editable = true }
itwinai            = "==0.3.0"


[tool.pixi.tasks]
toconda = "pixi workspace export conda-environment environment.yml"
